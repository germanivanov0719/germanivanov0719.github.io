<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Список постов</title>
  </head>
  <body>
    <main>
      <h1>Посты</h1>
      <ul id="posts-list"></ul>
    </main>

    <script>
      // === НАСТРОЙКИ ===
      const USERNAME = "germanivanov0719";
      const REPO = "germanivanov0719.github.io";
      const BRANCH = "main";
      const POSTS_PATH = "posts";

      // =================

      const apiUrl = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${POSTS_PATH}?ref=${BRANCH}`;

      async function loadPosts() {
        try {
          const res = await fetch(apiUrl);
          if (!res.ok) throw new Error("GitHub API error");

          const files = await res.json();

          const list = document.getElementById("posts-list");

          const htmlFiles = files
            .filter(
              (file) => file.type === "file" && file.name.endsWith(".html"),
            )
            .sort((a, b) => a.name.localeCompare(b.name));

          if (htmlFiles.length === 0) {
            list.innerHTML = "<li>Нет постов</li>";
            return;
          }

          htmlFiles.forEach((file) => {
            const li = document.createElement("li");

            const a = document.createElement("a");

            // URL для GitHub Pages
            a.href = `/${POSTS_PATH}/${file.name}`;

            // название (можешь потом парсить <title>, если захочешь усложнить)
            a.textContent = file.name.replace(".html", "");

            li.appendChild(a);
            list.appendChild(li);
          });
        } catch (err) {
          console.error(err);
          document.getElementById("posts-list").innerHTML =
            "<li>Ошибка загрузки</li>";
        }
      }

      loadPosts();
    </script>
  </body>
</html>
